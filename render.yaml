services:
  - type: web
    name: hogwarts-stories
    runtime: node
    plan: free
    rootDir: hogwarts-stories
    branch: claude/harry-potter-interactive-comic-9wtna3
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
